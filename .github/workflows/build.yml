name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y --fix-missing build-essential git ffmpeg libssl-dev libffi-dev python3-dev openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build with Buildozer
      run: yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ShuvoAI-APK
        path: bin/*.apk
        
