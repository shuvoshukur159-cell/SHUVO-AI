name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install buildozer cython==0.29.33

    - name: Setup Android SDK and NDK manually
      run: |
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        PLATFORM_DIR=$HOME/.buildozer/android/platform
        
        mkdir -p $ANDROID_HOME $PLATFORM_DIR
        
        # Download and setup command line tools
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv /tmp/cmdtools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        
        # Setup SDK manager symlink & licenses
        mkdir -p $ANDROID_HOME/tools/bin
        ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        mkdir -p $ANDROID_HOME/licenses
        echo -e "8933b5222d1927201a47f01507133a3b2936557d\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a637b3749d107399f6552647494f7760b" > $ANDROID_HOME/licenses/android-sdk-license

        # Download and extract NDK r25b cleanly without path conflict
        wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O /tmp/ndk.zip
        rm -rf $PLATFORM_DIR/android-ndk-r25b
        unzip -q /tmp/ndk.zip -d $PLATFORM_DIR

    - name: Build with Buildozer
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_NDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
      run: |
        unset ANDROID_SDK_ROOT
        unset ANDROIDSDK
        unset ANDROIDNDK
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK_LATEST_HOME

        # Clean old corrupted build states
        buildozer clean

        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ShuvoAI-APK
        path: bin/*.apk
