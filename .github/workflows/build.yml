name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install buildozer cython==0.29.33

    - name: Pre-accept SDK Licenses & Build
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      run: |
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip
        unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv /tmp/cmdtools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        
        # Create legacy tools directory and symlink
        mkdir -p $ANDROID_HOME/tools/bin
        ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        
        # Accept licenses
        mkdir -p $ANDROID_HOME/licenses
        echo -e "8933b5222d1927201a47f01507133a3b2936557d\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a637b3749d107399f6552647494f7760b" > $ANDROID_HOME/licenses/android-sdk-license

        # Clean up runner environment conflicts completely
        unset ANDROID_NDK_HOME
        unset ANDROID_SDK_ROOT
        unset ANDROIDSDK
        unset ANDROIDNDK
        
        # Force python-for-android to use the clean local paths without host site-packages interference
        export PYTHONNOUSERSITE=1

        # Run buildozer cleanly with log level 2 for full details if needed
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ShuvoAI-APK
        path: bin/*.apk
